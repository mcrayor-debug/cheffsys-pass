# Prueba y despliega la Edge Function pass-del-dia al hacer push a main.
# Secrets en GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_ACCESS_TOKEN  (token personal de Supabase)
#   SUPABASE_PROJECT_ID    (ref del proyecto CheffsysPass: ahynbrpnltagwqofelht)
name: Edge Function pass-del-dia
on:
  push:
    branches: [main]
    paths: ["supabase/functions/pass-del-dia/**", ".github/workflows/deploy-edge-function.yml"]
  workflow_dispatch:
jobs:
  test-y-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Pruebas de la fórmula
        run: deno test supabase/functions/pass-del-dia/formula_test.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Desplegar
        run: supabase functions deploy pass-del-dia --remote="$SUPABASE_PROJECT_ID" --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
